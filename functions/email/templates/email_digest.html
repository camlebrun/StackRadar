<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StackRadar — Release Digest</title>
  <meta name="color-scheme" content="light only">
  <meta name="supported-color-schemes" content="light only">
  <!-- Web fonts load in clients that allow them (Apple Mail, iOS); others use Georgia / Helvetica. -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@500;700&display=swap">
</head>
<body style="margin:0;padding:0;background:#f5f0e8;font-family:'DM Sans',Helvetica,Arial,sans-serif;">
  <div style="background:#f5f0e8;">
  <div style="max-width:580px;margin:0 auto;padding:32px 20px 48px;">

    <!-- Header -->
    <div style="background:#ffffff;border-radius:16px;border:1px solid #e6d8c8;padding:14px 20px;margin-bottom:28px;">
      <span style="font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-size:19px;font-weight:700;color:#1b2230;">&#128225; StackRadar</span>
    </div>

    <!-- Title -->
    <h1 style="margin:0 0 4px;color:#1b2230;font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-size:26px;font-weight:700;">
      {{count}} new release{{count_plural}}
    </h1>
    <p style="margin:0 0 24px;color:#5d6677;font-size:13px;line-height:1.5;">
      New releases detected across your tracked repositories.
    </p>

    <!-- Release cards -->
    {{cards}}

    <!-- Footer -->
    <p style="margin:20px 0 0;color:#5d6677;font-size:11px;text-align:center;">
      Sent by StackRadar &middot; You're receiving this because you're tracking releases.
    </p>

  </div>
  </div>
</body>
</html>
