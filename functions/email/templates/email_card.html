<div style="background:#ffffff;border-radius:16px;border:1px solid #e6d8c8;padding:22px 26px 18px;margin-bottom:16px;">

  <!-- Repo + severity -->
  <table cellpadding="0" cellspacing="0" border="0" width="100%">
    <tr>
      <td style="vertical-align:middle;font-size:11px;font-weight:700;letter-spacing:0.03em;color:#8d4f26;">{{repo_label}}</td>
      <td style="vertical-align:middle;text-align:right;white-space:nowrap;padding-left:12px;">
        <span style="background:{{sev_bg}};color:{{sev_fg}};padding:4px 12px;border-radius:6px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;">{{severity}}</span>
      </td>
    </tr>
  </table>

  <!-- Title + date -->
  <h3 style="margin:10px 0 2px;color:#1b2230;font-family:'Playfair Display',Georgia,'Times New Roman',serif;font-size:18px;font-weight:700;line-height:1.3;">{{title}}</h3>
  <p style="margin:0 0 10px;color:#5d6677;font-size:12px;">{{date}}</p>

  <!-- Summary -->
  <p style="margin:0 0 12px;color:#4f5d73;font-size:13px;line-height:1.55;">{{summary}}</p>

  <!-- Key changes -->
  {{changes_block}}

  <!-- Tags + link -->
  <table cellpadding="0" cellspacing="0" border="0" width="100%" style="margin-top:16px;">
    <tr>
      <td style="vertical-align:middle;">{{tags_block}}</td>
      <td style="vertical-align:middle;text-align:right;white-space:nowrap;padding-left:12px;">
        <a href="{{url}}" style="color:#8d4f26;font-size:12px;font-weight:600;text-decoration:none;">View release &rarr;</a>
      </td>
    </tr>
  </table>

</div>
